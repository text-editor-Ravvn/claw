# Claw Workspace Configuration
# Overrides global settings for this specific workspace / repository.

# Tab indentation width (1-16)
tab_width=4

# Display line numbers in left gutter (true/false)
show_line_numbers=true

# Display status bar (true/false)
show_statusbar=true

# Show welcome screen on empty buffer (true/false)
show_welcome=false

# Keymap configuration to use within this workspace
keymap=default
