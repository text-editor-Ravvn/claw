# Default key bindings for Claw

save = Ctrl+S
quit = Ctrl+X
search = Ctrl+F
replace = Ctrl+R
undo = Ctrl+Z
redo = Ctrl+Y
next_match = Ctrl+N
prev_match = Ctrl+P

# Workspace & Navigation (Phase 5)
goto_line = Alt+G
bookmark_toggle = Alt+B
bookmark_next = Alt+Down
bookmark_prev = Alt+Up
bookmark_clear = Alt+C
quick_switch = Alt+Q
file_explorer = Alt+E
workspace_open = Alt+W
session_save = Alt+S
session_restore = Alt+R
project_build = Ctrl+Shift+B
project_test = Ctrl+Shift+T
project_output = Ctrl+Shift+O
project_diagnostics = Ctrl+Shift+D
project_diagnostics_next = Ctrl+Down
project_diagnostics_previous = Ctrl+Up
project_dashboard = Ctrl+Shift+P

# IDE Foundation (Phase 8)
buffer_close = Ctrl+W
buffer_next = Ctrl+Tab
buffer_prev = Ctrl+Shift+Tab
split_vertical = Ctrl+\
split_horizontal = Ctrl+-
pane_switch = Alt+O
terminal_toggle = Ctrl+`
symbol_search = Ctrl+Shift+S

# Source Control Platform (Phase 9)
git_dashboard = Ctrl+Shift+G
git_diff = Ctrl+Shift+K
git_log = Ctrl+Shift+L
git_commit = Ctrl+Shift+C
git_branch = Ctrl+Shift+R
git_stash = Ctrl+Shift+Z

# Intelligent IDE Services (Phase 11)
lsp_completion = Ctrl+Space
lsp_definition = F12
lsp_hover = Alt+K
lsp_references = Shift+F12
lsp_code_action = Alt+Enter
lsp_diagnostics_next = F8
lsp_diagnostics_prev = Shift+F8

# Debug Adapter Protocol (Phase 12)
dap_toggle_breakpoint = F9
dap_continue = F5
dap_step_over = F10
dap_step_into = F11
dap_step_out = Shift+F11
dap_stop = Shift+F5
dap_dashboard = Alt+D

# Remote VFS & Templates (Phase 12)
remote_open = Alt+R
template_new = Ctrl+Shift+N

# Extension Marketplace (Phase 13)
marketplace_open = Alt+P
marketplace_update = Alt+U
